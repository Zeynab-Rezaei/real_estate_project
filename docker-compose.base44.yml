name: horizon-properties

services:
  api:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --loglevel=error
        exec npm run api
    environment:
      - NODE_ENV=development
      - PORT=8000
      - STORAGE_DIR=/app/server/storage
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - api_node_modules:/app/node_modules
      - api_storage:/app/server/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: on-failure
    labels:
      base44.project: Horizon Properties API
      base44.kind: api
      base44.port: "8000"

  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --loglevel=error
        exec npm run dev
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: Horizon Properties
      base44.kind: web
      base44.port: "3000"

volumes:
  api_node_modules:
  web_node_modules:
  api_storage:
